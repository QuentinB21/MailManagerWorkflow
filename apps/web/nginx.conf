server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Le proxy de production retire ce préfixe. Cette route conserve aussi un
    # accès direct fonctionnel au conteneur pendant le développement local.
    location = /projets/MailManager {
        return 308 /projets/MailManager/;
    }

    location /projets/MailManager/ {
        rewrite ^/projets/MailManager/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
