name: mail-manager-workflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Database__ApplyMigrations: "true"
      WebOrigin: http://localhost:5173
      Gmail__ClientId: ${GMAIL_CLIENT_ID:-}
      Gmail__ClientSecret: ${GMAIL_CLIENT_SECRET:-}
      Gmail__RedirectUri: http://localhost:8080/api/gmail/oauth/callback
      Gmail__WebAppUrl: http://localhost:5173
      Outlook__ClientId: ${OUTLOOK_CLIENT_ID:-}
      Outlook__ClientSecret: ${OUTLOOK_CLIENT_SECRET:-}
      Outlook__Tenant: ${OUTLOOK_TENANT:-common}
      Outlook__RedirectUri: http://localhost:8080/api/outlook/oauth/callback
      Outlook__WebAppUrl: http://localhost:5173
      DataProtection__KeysPath: /var/lib/mail-manager/keys
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api-data-protection-keys:/var/lib/mail-manager/keys

  web:
    build:
      context: apps/web
      args:
        VITE_API_URL: http://localhost:8080
        VITE_N8N_WEBHOOK_URL: http://localhost:5678/webhook/mail-manager/email
    ports:
      - "5173:80"
    depends_on:
      - api

  n8n:
    build:
      context: .
      dockerfile: infra/n8n/Dockerfile
    image: mail-manager-workflow-n8n:2.34.4
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Paris}
      TZ: ${GENERIC_TIMEZONE:-Europe/Paris}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BOOTSTRAP_FORCE_IMPORT: ${N8N_BOOTSTRAP_FORCE_IMPORT:-false}
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      - api

volumes:
  postgres-data:
  n8n-data:
  api-data-protection-keys:
